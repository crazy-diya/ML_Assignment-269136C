name: Build image and deploy to Azure Container Apps

# Builds the Docker image and publishes it to GitHub Container Registry on every change to the app or the model.
# If the repository secret AZURE_CREDENTIALS is set, the new image is also rolled out to Azure Container Apps.
on:
  push:
    branches: [main]
    paths: [app.py, carprep.py, model.pkl, model_meta.json, requirements.txt, Dockerfile]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/crazy-diya/car-price-app
  AZURE_RG: rg-car-price-mlops
  AZURE_APP: car-price-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Log in to Azure
        id: azure
        env:
          HAS_CREDS: ${{ secrets.AZURE_CREDENTIALS != '' }}
        if: env.HAS_CREDS == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Roll out the new image
        if: steps.azure.outcome == 'success'
        run: |
          az containerapp update -n "$AZURE_APP" -g "$AZURE_RG" --image "$IMAGE:${{ github.sha }}"
          fqdn=$(az containerapp show -n "$AZURE_APP" -g "$AZURE_RG" --query properties.configuration.ingress.fqdn -o tsv)
          echo "Deployed to https://$fqdn" | tee -a "$GITHUB_STEP_SUMMARY"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://$fqdn/_stcore/health" || true)
            [ "$code" = "200" ] && { echo "healthy"; exit 0; }
            sleep 6
          done
          echo "health check failed"; exit 1
